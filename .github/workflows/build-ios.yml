name: Build iOS

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-ios.yml
      - 'packages/react-native-shiki-engine/cpp/**'
      - 'packages/react-native-shiki-engine/apple/**'
      - 'packages/react-native-shiki-engine/src/**'
      - 'packages/react-native-shiki-engine/*.podspec'
      - 'packages/react-native-shiki-engine/package.json'
      - 'examples/react-native/ios/**'
  pull_request:
    paths:
      - .github/workflows/build-ios.yml
      - 'packages/react-native-shiki-engine/cpp/**'
      - 'packages/react-native-shiki-engine/apple/**'
      - 'packages/react-native-shiki-engine/src/**'
      - 'packages/react-native-shiki-engine/*.podspec'
      - 'packages/react-native-shiki-engine/package.json'
      - 'examples/react-native/ios/**'

permissions:
  contents: read

jobs:
  build_example:
    name: Build iOS Example App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Create Node.js symlink
        run: |
          sudo ln -sf "$(which node)" /usr/local/bin/node

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Package
        run: pnpm --filter react-native-shiki-engine build

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: examples/react-native

      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
            ~/Library/Caches/ReactNative
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('**/Podfile.lock', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Install Pods
        shell: bash
        working-directory: examples/react-native/ios
        env:
          # Avoid CocoaPods ArgumentError "pathname contains null byte" on runners
          # with a non-UTF-8 locale (cocoapods/cocoapods#12798 / #12866).
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          set -euo pipefail
          # Don't restore a cached Pods/ tree, RN prebuilds leave React-Core-prebuilt
          # Headers/module.modulemap missing across version bumps and Debug/Release swaps.
          rm -rf Pods build
          bundle exec pod install

      - name: Build App
        run: |
          xcodebuild \
            -workspace ShikiEngineExample.xcworkspace \
            -scheme ShikiEngineExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            SKIP_BUNDLING=1 \
            build
        working-directory: examples/react-native/ios
