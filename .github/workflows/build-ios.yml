name: Build iOS

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-ios.yml
      - 'packages/react-native-shiki-engine/cpp/**'
      - 'packages/react-native-shiki-engine/apple/**'
      - 'packages/react-native-shiki-engine/*.podspec'
      - 'examples/react-native/ios/**'
  pull_request:
    paths:
      - .github/workflows/build-ios.yml
      - 'packages/react-native-shiki-engine/cpp/**'
      - 'packages/react-native-shiki-engine/apple/**'
      - 'packages/react-native-shiki-engine/*.podspec'
      - 'examples/react-native/ios/**'

jobs:
  build_example:
    name: Build iOS Example App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Create Node.js symlink
        run: |
          sudo ln -sf "$(which node)" /usr/local/bin/node

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          cache: true

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Package
        run: pnpm --filter react-native-shiki-engine build

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: examples/react-native

      - name: Cache Pods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            examples/react-native/ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install Pods
        shell: bash
        working-directory: examples/react-native/ios
        run: |
          set -euo pipefail

          install_pods() {
            bundle exec pod install
          }

          if ! install_pods; then
            echo "::warning::pod install failed; cleaning iOS artifacts and retrying once"
            rm -rf Pods build
            install_pods
          fi

      - name: Build App
        run: |
          xcodebuild \
            -workspace ShikiEngineExample.xcworkspace \
            -scheme ShikiEngineExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            SKIP_BUNDLING=1 \
            build
        working-directory: examples/react-native/ios
