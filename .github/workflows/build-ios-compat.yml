name: Build iOS Compat

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-ios-compat.yml
      - packages/react-native-shiki-engine/cpp/**
      - packages/react-native-shiki-engine/apple/**
      - packages/react-native-shiki-engine/*.podspec
      - packages/react-native-shiki-engine/package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/scripts/**
  pull_request:
    paths:
      - .github/workflows/build-ios-compat.yml
      - packages/react-native-shiki-engine/cpp/**
      - packages/react-native-shiki-engine/apple/**
      - packages/react-native-shiki-engine/*.podspec
      - packages/react-native-shiki-engine/package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/scripts/**

permissions:
  contents: read

concurrency:
  group: ios-compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_library:
    name: iOS RN ${{ matrix.rn-version }}${{ matrix.use-frameworks && format(' ({0})', matrix.use-frameworks) || '' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rn-version: 0.77.3
            node-version: '20'
          - rn-version: 0.81.6
            node-version: '20'
          - rn-version: 0.81.6
            node-version: '20'
            use-frameworks: static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Create Node.js symlink
        run: |
          sudo ln -sf "$(which node)" /usr/local/bin/node

      - name: Setup Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Build library against React Native ${{ matrix.rn-version }}
        env:
          CI: true
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          USE_FRAMEWORKS: ${{ matrix.use-frameworks }}
        run: bash .github/scripts/ios-compat.sh "${{ matrix.rn-version }}"
