catalogMode: prefer
minimumReleaseAgeExcludePrune: true
shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - ua-parser-js@1.0.41

packages:
  - packages/*
  - examples/*

catalogs:
  babel:
    '@babel/core': 7.29.7
    '@babel/runtime': 7.29.7
    '@types/babel__core': 7.20.5
    babel-plugin-module-resolver: ^5.0.3
  build:
    '@release-it/conventional-changelog': ^12.0.2
    react-native-builder-bob: ^0.44.1
    release-it: ^21.1.1
    vite-plus: ^1.4.0
  eslint:
    '@rari/lint': ^0.1.5
    eslint: ^10.13.0
  react:
    '@react-native/babel-preset': 0.88.1
    '@react-native/codegen': 0.88.1
    '@react-native/gradle-plugin': 0.88.1
    '@react-native/metro-config': 0.88.1
    expo: ^58.0.21
    react: 19.3.0
    react-dom: 19.3.0
    react-native: 0.88.1
    react-native-safe-area-context: ^5.11.0
    react-native-web: ^0.21.4
  react-native-cli:
    '@react-native-community/cli': ^20.2.0
    '@react-native-community/cli-platform-android': ^20.2.0
    '@react-native-community/cli-platform-ios': ^20.2.0
  shiki:
    '@shikijs/core': ^4.5.0
    '@shikijs/engine-oniguruma': ^4.5.0
    '@shikijs/langs': ^4.5.0
    '@shikijs/themes': ^4.5.0
    '@shikijs/types': ^4.5.0
    '@shikijs/vscode-textmate': ^10.1.0
  types:
    '@types/node': ^26.6.6
    '@types/react': 19.2.18
    # https://devblogs.microsoft.com/typescript/announcing-typescript-7-0/#running-side-by-side-with-typescript-6.0
    typescript: npm:@typescript/typescript6@^6.0.2
    typescript-7: npm:typescript@^7.0.2

allowBuilds:
  msgpackr-extract: true
